name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Test (builds dist/OrderDesk.gs, then runs the suite)
        run: npm test
      - name: Bundle is up to date
        run: git diff --exit-code dist/OrderDesk.gs
